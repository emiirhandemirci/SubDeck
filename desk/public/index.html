<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="subdeck-token" content="__SUBDECK_TOKEN__">
  <title>SubDeck Desk</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="currentColor"/><rect x="5" y="6" width="14" height="3" rx="1.5" fill="#fff"/><rect x="5" y="11" width="10" height="3" rx="1.5" fill="#fff" opacity=".85"/><rect x="5" y="16" width="6" height="3" rx="1.5" fill="#fff" opacity=".7"/></svg>
      <h1>SubDeck <span class="brand-sub">Desk</span></h1>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button id="tabSessions" class="tab" type="button" role="tab" aria-selected="true">Sessions</button>
      <button id="tabTasks" class="tab" type="button" role="tab" aria-selected="false">Tasks</button>
      <button id="tabSettings" class="tab" type="button" role="tab" aria-selected="false">Settings</button>
    </nav>
    <div class="src-group">
      <div id="sources" class="sources" aria-label="Sources"></div>
      <button id="srcMore" class="src-more" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="srcPanel" hidden></button>
      <button id="srcInfo" class="info-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="srcPanel" aria-label="Tool detection details" title="Tool detection details"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/></svg></button>
      <div id="srcPanel" class="pop" role="dialog" aria-label="Tool detection details" tabindex="-1" hidden></div>
    </div>
    <div class="status">
      <div id="themeSwitch" class="segs" role="group" aria-label="Theme"></div>
      <button id="bell" class="bell" type="button" role="switch" aria-checked="false" title="Desktop notifications: off" hidden></button>
      <button id="waitingCount" class="live waiting waiting-chip" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="waitingPanel" hidden></button>
      <div id="waitingPanel" class="waiting-panel" role="dialog" aria-label="Waiting for you" hidden></div>
      <span id="live" class="live off" role="status">Connecting…</span>
      <span id="lastScan" class="muted last-scan"></span>
    </div>
  </header>
  <main id="panesView" class="panes">
    <section class="pane" aria-labelledby="h-projects">
      <h2 id="h-projects">Projects</h2>
      <div class="controls">
        <input id="filter" type="search" placeholder="Filter projects" aria-label="Filter projects">
        <label class="toggle"><input id="onlyActive" type="checkbox"> Only active</label>
        <label class="toggle" title="Projects inside the system temp folder are hidden by default"><input id="showTemp" type="checkbox"> Show temporary projects</label>
      </div>
      <div id="notices"></div>
      <div id="projects" class="pbody" role="listbox" aria-label="Projects" tabindex="-1"></div>
    </section>
    <section class="pane" aria-labelledby="h-map">
      <h2 id="h-map">Agent map</h2>
      <div id="map" class="pbody" role="tree" aria-label="Sessions and agents" tabindex="-1"></div>
      <div id="announce" class="sr-only" aria-live="polite"></div>
    </section>
    <section class="pane" aria-labelledby="h-detail">
      <h2 id="h-detail">Detail</h2>
      <div id="detail" class="pbody"><p class="empty">Select a session or agent</p></div>
    </section>
  </main>
  <main id="settingsView" class="settings" hidden aria-labelledby="h-settings">
    <div class="settings-head">
      <h2 id="h-settings">Settings</h2>
      <div id="scopeSwitch" class="segs" role="group" aria-label="Scope"></div>
    </div>
    <div id="settingsBody"></div>
  </main>
  <main id="tasksView" class="tasks" hidden aria-labelledby="h-tasks">
    <div class="settings-head">
      <h2 id="h-tasks">Tasks</h2>
      <select id="tasksProject" aria-label="Project"></select>
    </div>
    <div id="tasksBody"></div>
  </main>
  <dialog id="confirmDlg" class="dlg" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle">Lower protection?</h3>
    <p id="confirmText"></p>
    <div class="dlg-actions"><button id="confirmNo" type="button">Cancel</button><button id="confirmYes" type="button" class="danger">Turn off</button></div>
  </dialog>
</body>
</html>
